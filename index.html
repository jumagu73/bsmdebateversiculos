<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSM · Versículo al azar</title>
<style>
  :root{
    --bg:#0f0f13;
    --card:#1a1a22;
    --accent:#ff3d6e;
    --accent2:#3ddcff;
    --text:#f2f2f7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:1.8rem;
    background:radial-gradient(circle at 20% 20%, #1f1f2b, var(--bg) 60%);
    color:var(--text);
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding:2rem;
    text-align:center;
  }
  h1{font-size:clamp(1.5rem, 4vw, 2.4rem); letter-spacing:.05em; text-transform:uppercase;}
  h1 span{color:var(--accent);}
  .sub{opacity:.6; font-size:.95rem; margin-top:.4rem;}
  .card{
    width:100%;
    max-width:760px;
    min-height:260px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.2rem;
    padding:2.5rem 2rem;
    background:var(--card);
    border-radius:28px;
    border:2px solid var(--accent);
    transition:transform .25s ease, border-color .25s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,61,110,.15), rgba(61,220,255,.15));
    opacity:0; transition:opacity .3s;
  }
  .card:hover::before{opacity:1;}
  .card .contenido{
    font-size:clamp(1.25rem, 3vw, 1.9rem);
    font-weight:500;
    font-style:italic;
    line-height:1.45;
    letter-spacing:.01em;
  }
  .card .ref{font-size:1rem; opacity:.55; font-style:italic; transition:opacity .3s;}
  .card .ref.oculta{opacity:0;}
  .card.pop{animation:pop .5s ease;}
  @keyframes pop{
    0%{transform:scale(.9); opacity:.3;}
    60%{transform:scale(1.03);}
    100%{transform:scale(1); opacity:1;}
  }
  .acciones{display:flex; flex-wrap:wrap; gap:1rem; justify-content:center;}
  button.principal{
    cursor:pointer;
    font-size:1.1rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:1.1rem 2.6rem;
    border:none;
    border-radius:999px;
    color:#0f0f13;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 30px rgba(255,61,110,.35);
  }
  button.secundario{
    cursor:pointer;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:1rem 2.2rem;
    border-radius:999px;
    background:transparent;
    color:var(--text);
    border:2px solid #ffffff33;
    transition:transform .15s ease;
  }
  button:hover{transform:translateY(-2px) scale(1.03);}
  button:active{transform:scale(.97);}
  .progreso{opacity:.5; font-size:.85rem;}
</style>
</head>
<body>

  <header>
    <h1>BSM <span>·</span> Versículo al azar</h1>
    <p class="sub">Sale un versículo al azar. El equipo se arregla para hablar de eso.</p>
  </header>

  <main class="card" id="card">
    <span class="contenido">—</span>
    <span class="ref oculta"></span>
  </main>

  <div class="acciones">
    <button id="btn" class="principal">Tirar versículo</button>
    <button id="btnRef" class="secundario">Mostrar referencia</button>
  </div>

  <p class="progreso" id="progreso"></p>

  const card = document.getElementById("card");
  const btn = document.getElementById("btn");
  const btnRef = document.getElementById("btnRef");
  const progreso = document.getElementById("progreso");

  let refsVisibles = false;
  let cola = [];

  function shuffle(arr){
    const copia = [...arr];
    for(let i = copia.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function sacarUno(){
    if(cola.length === 0) cola = shuffle(VERSICULOS);
    return cola.pop();
  }

  function actualizarProgreso(){
    progreso.textContent = `Quedan sin repetir: ${cola.length}/${VERSICULOS.length}`;
  }

  function tirar(){
    const item = sacarUno();

    card.classList.remove("pop");
    void card.offsetWidth;

    card.querySelector(".contenido").textContent = "«" + item.t + "»";
    const ref = card.querySelector(".ref");
    ref.textContent = item.r;
    ref.classList.toggle("oculta", !refsVisibles);

    card.classList.add("pop");
    actualizarProgreso();
  }

  btn.addEventListener("click", tirar);

  btnRef.addEventListener("click", () => {
    refsVisibles = !refsVisibles;
    card.querySelector(".ref").classList.toggle("oculta", !refsVisibles);
    btnRef.textContent = refsVisibles ? "Ocultar referencia" : "Mostrar referencia";
  });

  tirar();
</script>
